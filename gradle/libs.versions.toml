[versions]
# Kotlin
kotlin = "2.4.21"
kapt = "2.4.21"

# Micronaut
micronaut-version = "5.2.6"
micronaut-application = "5.0.2"
micronaut-openapi = "5.0.2"
micronaut-openapi-generator = "7.3.0"

# Plugins
kotlinter = "5.7.0"
detekt = "2.0.0-alpha.6"
shadow = "9.6.1"

# Libraries
strikt = "0.35.1"
arrow = "2.3.0.1"
wiremock-micronaut = "0.2.0"
tamboui = "0.7.0"
archunit = "1.5.1"
arrow-detekt-rules = "0.3.0"
jackson2 = "2.23.0"
guava = "33.8.0-jre"

[libraries]

# Micronaut
micronaut-kotlin-extension-functions = { module = "io.micronaut.kotlin:micronaut-kotlin-extension-functions" }
micronaut-kotlin-runtime = { module = "io.micronaut.kotlin:micronaut-kotlin-runtime" }
micronaut-picocli = { module = "io.micronaut.picocli:micronaut-picocli" }
micronaut-serde-processor = { module = "io.micronaut.serde:micronaut-serde-processor" }
micronaut-serde-jackson = { module = "io.micronaut.serde:micronaut-serde-jackson" }
micronaut-http-client = { module = "io.micronaut:micronaut-http-client" }

# Kotlin
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }

# Logging
logback-classic = { module = "ch.qos.logback:logback-classic" }

# CLI
picocli = { module = "info.picocli:picocli" }
picocli-codegen = { module = "info.picocli:picocli-codegen" }

# Tambui
tamboui-bom = { module = "dev.tamboui:tamboui-bom", version.ref = "tamboui" }
tamboui-toolkit = { module = "dev.tamboui:tamboui-toolkit" }
tamboui-jline3-backend = { module = "dev.tamboui:tamboui-jline3-backend" }

# Arrow
arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }

# Jackson 2 (OpenAPI generator only)
jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson2" }

# Guava (OpenAPI generator only)
guava-bom = { module = "com.google.guava:guava-bom", version.ref = "guava" }

# Testing
junit-platform-suite = { module = "org.junit.platform:junit-platform-suite-engine" }
strikt-core = { module = "io.strikt:strikt-core", version.ref = "strikt" }
strikt-arrow = { module = "io.strikt:strikt-arrow", version.ref = "strikt" }
wiremock-micronaut = { module = "io.github.leeturner:wiremock-micronaut", version.ref = "wiremock-micronaut" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

# Detekt
arrow-detekt-rules = { module = "io.github.leeturner:arrow-detekt-rules", version.ref = "arrow-detekt-rules" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }
kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kapt" }
micronaut-application = { id = "io.micronaut.application", version.ref = "micronaut-application" }
micronaut-openapi = {id = "io.micronaut.openapi", version.ref = "micronaut-openapi" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter" }
detekt = { id = "dev.detekt", version.ref = "detekt" }

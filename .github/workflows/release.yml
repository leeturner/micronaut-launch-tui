name: Release

# A v* tag builds the native binaries and publishes them as a GitHub Release.
# Running it by hand builds and checks them without releasing anything.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-aarch64
            ext: ''
            archive: tar.gz
          - os: ubuntu-latest
            platform: linux-x86_64
            ext: ''
            archive: tar.gz
          - os: windows-latest
            platform: windows-x86_64
            ext: '.exe'
            archive: zip

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: '25'
          distribution: 'graalvm-community'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Work out the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev" >> "$GITHUB_ENV"
          fi

      - name: Build native image
        run: ./gradlew nativeCompile -Pversion="$VERSION"

      - name: Check the binary starts
        run: |
          actual=$(build/native/nativeCompile/mtui${{ matrix.ext }} --version | tr -d '\r')
          echo "mtui --version printed: $actual"
          [ "$actual" = "$VERSION" ]

      # The binary sits at the top of the archive, so unpacking gives mtui straight away
      - name: Archive
        run: |
          name="mtui-$VERSION-${{ matrix.platform }}.${{ matrix.archive }}"
          cd build/native/nativeCompile
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$GITHUB_WORKSPACE/$name" mtui.exe
          else
            tar -czf "$GITHUB_WORKSPACE/$name" mtui
          fi
          echo "ARCHIVE=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true

micronaut.application.name=mtui

# Set by Gradle from the project version, e.g. -Pversion=0.2.0
mtui.version=@version@

micronaut.http.services.micronaut-launch.url=https://launch.micronaut.io

# Snapshot builds of Micronaut; the release server is micronaut-launch above
mtui.launch.snapshot-url=https://snapshot.micronaut.io
